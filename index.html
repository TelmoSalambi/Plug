    <meta name="theme-color" content="#0A0A0A" />
    <link rel="icon" type="image/jpeg" href="./favicon.jpg" />

    <!-- Canonical definido via JS em runtime (base relativa ./ funciona com subpastas e file://) -->
    <meta
      name="description"
      content="Grupo Plug Business — Lubango, Angola. iPhones e tecnologia selados, compra e troca de ouro na hora (Ourivesaria Plug Golden), e limpeza profunda de sofás e viaturas (Plug Clean). Marca angolana de confiança com atendimento em Lubango, Namibe, Benguela e Luanda."
    />
    <meta
      name="keywords"
      content="Plug Business, Angola, Lubango, iPhone, ouro, ourivesaria, limpeza de sofá, Plug Clean, Plug Golden, Huíla"
    />
    <meta name="author" content="Grupo Plug Business" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_AO" />
    <meta property="og:site_name" content="Grupo Plug Business" />
    <meta
      property="og:title"
      content="Grupo Plug Business | Tecnologia, Ourivesaria e Limpeza em Lubango, Angola"
    />
    <meta
      property="og:description"
      content="iPhones e tecnologia, compra e troca de ouro na hora e limpeza profunda de sofás e viaturas. Marca angolana de confiança em Lubango, Namibe, Benguela e Luanda."
    />
    <meta property="og:image" content="./og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Grupo Plug Business — Tecnologia, Ourivesaria e Plug Clean"
    />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Grupo Plug Business | Tecnologia, Ourivesaria e Limpeza em Lubango, Angola"
    />
    <meta
      name="twitter:description"
      content="iPhones e tecnologia, compra e troca de ouro na hora e limpeza profunda de sofás e viaturas. Marca angolana de confiança em Angola."
    />
    <meta name="twitter:image" content="./og-image.jpg" />

    <!-- JSON-LD: LocalBusiness -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "LocalBusiness",
        "name": "Grupo Plug Business",
        "image": "./og-image.jpg",
        "description": "iPhones e tecnologia, compra e troca de ouro (Ourivesaria Plug Golden) e limpeza profunda (Plug Clean) em Lubango, Angola.",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Rua da Clínica Danfran, ao lado do ATM do Banco Atlântico",
          "addressLocality": "Lubango",
          "addressRegion": "Huíla",
          "addressCountry": "AO"
        },
        "telephone": "+244941216095",
        "openingHours": "Mo-Sa 08:00-18:00",
        "areaServed": ["Lubango", "Namibe", "Benguela", "Luanda"],
        "sameAs": ["https://instagram.com/plugbusiness.lda", "https://tiktok.com/@plugbusiness.lda"]

    <meta name="format-detection" content="telephone=yes" />
